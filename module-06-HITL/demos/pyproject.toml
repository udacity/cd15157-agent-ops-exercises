[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/realthor"]

[project]
name = "realthor"
version = "0.6.0"
description = "RealThor demos — human-in-the-loop and policies concept walkthrough"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]
